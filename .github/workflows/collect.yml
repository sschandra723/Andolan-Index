name: Collect new stories

# Every 6 hours: find new protest stories, let the AI assistant draft and check them, and open a pull request
# for an editor. Nothing is published until that pull request is merged.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # also enable: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect candidates
        run: python -m andolan collect

      - name: Read the AI settings
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          from andolan.ai import load_config
          c = load_config()
          print(f"AI_PROVIDER={c['provider']}")
          print(f"OLLAMA_MODEL={c['ollama']['model']}")
          PY
      - name: Keep the open model between runs
        if: env.AI_PROVIDER == 'ollama'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}
      - name: Start the open model
        if: env.AI_PROVIDER == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
      - name: Draft and check with the AI assistant
        run: python -m andolan ai --summary-file "$RUNNER_TEMP/summary.md"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Ask the Internet Archive for copies of recent reports
        run: python -m andolan archive --limit 15
        continue-on-error: true
      - run: python -m andolan validate
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/inbox
          add-paths: data/
          commit-message: "Add candidate stories with AI drafts"
          title: "Review new stories"
          body-path: ${{ runner.temp }}/summary.md
          delete-branch: true
