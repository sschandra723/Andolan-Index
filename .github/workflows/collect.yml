name: Collect new stories

# Every 3 hours: find new protest stories, let the AI assistant draft and check them, and open a pull request
# for an editor. Nothing is published until that pull request is merged.
# While one review pull request is open, later runs add to it instead of opening another.
# GitHub starts scheduled runs late and sometimes skips them, so the schedule is more frequent than strictly needed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # also enable: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Keep the stories already waiting in the open review
        # The review branch is rebuilt from main on every run. Bring back the stories the open pull request already
        # holds, with their drafts, so a story that has since dropped out of the news feeds is not lost.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head bot/inbox --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open review; starting from main."; exit 0; fi
          git fetch --no-tags --depth=1 origin bot/inbox
          n=0
          for f in $(gh pr diff "$pr" --name-only | grep -E '^data/inbox/[^/]+\.json$' || true); do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then git show "FETCH_HEAD:$f" > "$f"; else rm -f "$f"; fi
            n=$((n + 1))
          done
          echo "Kept $n inbox file(s) from pull request #$pr"

      - name: Collect candidates
        run: python -m andolan collect

      - name: Read the AI settings
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          from andolan.ai import load_config
          c = load_config()
          print(f"AI_PROVIDER={c['provider']}")
          print(f"OLLAMA_MODEL={c['ollama']['model']}")
          PY
      - name: Keep the open model between runs
        if: env.AI_PROVIDER == 'ollama'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}
      - name: Start the open model
        if: env.AI_PROVIDER == 'ollama'
        continue-on-error: true   # if the model cannot be installed, the stories still go to review undrafted
        timeout-minutes: 20
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
      - name: Draft and check with the AI assistant
        continue-on-error: true   # it still writes the review summary; undrafted stories are drafted on a later run
        run: python -m andolan ai --summary-file "$RUNNER_TEMP/summary.md"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Ask the Internet Archive for copies of recent reports
        run: python -m andolan archive --limit 15
        continue-on-error: true
      - run: python -m andolan validate
      - name: Make sure the review has a description
        run: test -s "$RUNNER_TEMP/summary.md" || python -c "from andolan.ai import pr_summary; print(pr_summary())" > "$RUNNER_TEMP/summary.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/inbox
          add-paths: data/
          commit-message: "Add candidate stories with AI drafts"
          title: "Review new stories"
          body-path: ${{ runner.temp }}/summary.md
          delete-branch: true
