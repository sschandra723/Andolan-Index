name: Deploy site

# Rebuilds on every merge to main, and once a day so that Active / Quiet labels change as time passes
# even when nothing new has been merged.
on:
  push:
    branches: [main]
  workflow_run:            # after each collection, so the 'Waiting for review' list stays current
    workflows: ["Collect new stories"]
    types: [completed]
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Include stories waiting for review (only their headlines and links are shown)
        run: |
          if git fetch --depth=1 origin bot/inbox:refs/remotes/origin/bot/inbox 2>/dev/null; then
            git checkout origin/bot/inbox -- data/inbox
          else
            echo "No stories waiting for review."
          fi
      - run: python -m andolan validate
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: python -m andolan build
        env:
          ANDOLAN_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
