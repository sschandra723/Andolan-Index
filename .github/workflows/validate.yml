name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data is valid
        run: python -m andolan validate
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Site builds
        run: python -m andolan build --out "$RUNNER_TEMP/site"
