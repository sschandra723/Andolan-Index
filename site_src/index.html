<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#efb22b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2058" media="(prefers-color-scheme: dark)">
{{head_extra}}
<link rel="alternate" type="application/atom+xml" title="New reports" href="{{root}}feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts}}">
<link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<noscript>{{noscript}}</noscript>
<script type="application/json" id="andolan-data">{{data}}</script>
<script src="{{root}}assets/app.js"></script>
</body>
</html>
